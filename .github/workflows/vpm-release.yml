name: VPM Release
on: push
jobs:
  vpm-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '24.22.1'
          registry-url: https://npm.pkg.github.com
          scope: com.nekometer.esnya
      - run: node --version && npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify release tooling without side effects
        run: node .github/scripts/release-tooling-smoke.mjs . template
      - name: Verify generated archive caller fixture
        run: node .github/scripts/archive-compat-smoke.mjs . .github/scripts/create-unitypackage.ts
      - if: ${{ !startsWith(github.ref, 'refs/heads/codex/') }}
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_REGISTRY: https://npm.pkg.github.com
